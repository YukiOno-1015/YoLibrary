repos:
  # ---- secret検出(全体) ----
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ---- SAST(全体) ----
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.172.0
    hooks:
      - id: semgrep
        args: ['--config', 'p/ci', '--error', '--skip-unknown-extensions']
